# Çöp Adam Kripto — ayarlar (tasarım: cizgi-kripto-yorum-kanali.md)

daily_videos: 3            # günlük Shorts üst sınırı: 3 slot x 1 video (yükselen/düşen sırayla); para kazanma için hacim düşük tutulur
pair_gap_minutes: 5        # aynı çalıştırmadaki iki video arası
universe_pages: 2          # CoinGecko piyasa değerine göre ilk 500 coin içinden yükselen/düşen

filters:                   # Bölüm 5: mikro coin / stablecoin koruması
  min_market_cap: 100000000  # 2026-10-06: 50M -> 100M (spekülatif mikro coin riskini azaltmak için)
  min_volume_24h: 15000000
  exclude_symbols: [usdt, usdc, dai, fdusd, tusd, usde, usds, pyusd, usdd, busd, frax, lusd, gusd, usdp, eurc, eurt,
                    usd1, rlusd, usdtb, susde, susds, wbtc, weth, steth, wsteth, weeth, cbbtc, cbeth, reth, wbeth,
                    rseth, ezeth, meth, lbtc, solvbtc, jitosol, msol, bnsol, wbnb, wtrx, btcb, bsc-usd, xaut, paxg]
  exclude_name_words: [wrapped, bridged, staked, restaked, liquid staking, pegged, tokenized, usd]

sibling_channels:          # kendi diğer kripto kanalların: son 36 saatte işlediği coinler burada atlanır
  - UCI_XVm_aXq3grR453_OdPJw # Whale Market Pulse (crypto-shorts-factory)

repeat:
  hours: 48                # aynı coin 48 saat işlenmez...
  move_override_pct: 15    # ...son videodan beri %15'ten fazla oynamadıysa

chart:
  interval: 4h
  history_candles: 200     # seviye hesabı
  show_candles: 42         # ekranda son 7 gün
  level_min_pct: 0.5       # fiyata %0.5'ten yakın seviye kullanılmaz
  level_max_pct: 25        # %25'ten uzak seviye kullanılmaz

freshness:
  max_move_pct: 3          # render -> yayın arası fiyat %3'ten fazla oynarsa video iptal, baştan üretilir

# Kokoro ses kimlikleri (karakter başına sabit)
voices:
  charlie: {voice: am_michael, speed: 1.06, pitch: 0.97}
  moon_max: {voice: am_puck, speed: 1.16, pitch: 1.10}
  bear_betty: {voice: af_kore, speed: 1.03, pitch: 0.96}
