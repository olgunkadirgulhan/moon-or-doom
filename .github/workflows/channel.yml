name: channel
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth requests
      - name: Channel setup
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: python channel_setup.py
      - name: Commit playlists
        run: |
          git config user.name "stickcoin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add playlists.json history.json
          git diff --cached --quiet && exit 0
          git commit -m "channel: playlists"
          git pull --rebase
          git push
