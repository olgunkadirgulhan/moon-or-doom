name: videos
on:
  schedule:
    # Shorts: günde 2 çalıştırma x (en çok yükselen + en çok düşen, 5 dk arayla) = 4 video.
    # TR ~16:00 ve ~23:00 (ABD sabah / öğleden sonra). Cron ~25 dk önce başlar (GitHub gecikmesi + render).
    - cron: "35 12 * * *"
    - cron: "35 19 * * *"
    # Uzun video (16:9): Çarşamba 'majors' (piyasa değeri ilk 5), Pazar 'weekly' (haftanın 3+3 hareketlisi), TR ~18:30
    - cron: "0 15 * * 3"
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: shorts | weekly | majors
        type: choice
        options: [shorts, weekly, majors]
        default: shorts
      no_upload:
        description: Render only, do not upload
        type: boolean
        default: false
      coin:
        description: (shorts) Force a CoinGecko id, e.g. solana. Empty = automatic pick
        type: string
        default: ""
      format:
        description: (shorts) Force a format
        type: choice
        options: [auto, levels, what_is, school, skit]
        default: auto

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev pkg-config
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stickstory
          key: kokoro-v1.0
      - name: Validator self-test
        run: python tests/test_validate.py
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "m=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 15 * * 3" ]; then echo "m=majors" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 15 * * 0" ]; then echo "m=weekly" >> $GITHUB_OUTPUT
          else echo "m=shorts" >> $GITHUB_OUTPUT; fi
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          SCRIPT_SOURCE: ${{ vars.SCRIPT_SOURCE }}
          MODE: ${{ steps.mode.outputs.m }}
          NO_UPLOAD: ${{ inputs.no_upload }}
          COIN: ${{ inputs.coin }}
          FORMAT: ${{ inputs.format }}
        run: |
          ARGS=()
          [ "$NO_UPLOAD" = "true" ] && ARGS+=(--no-upload)
          if [ "$MODE" != "shorts" ]; then ARGS+=(--long "$MODE")
          else
            [ -n "$COIN" ] && ARGS+=(--coin "$COIN")
            [ -n "$FORMAT" ] && [ "$FORMAT" != "auto" ] && ARGS+=(--format "$FORMAT")
          fi
          python run.py "${ARGS[@]}"
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/script.json
            output/*/data.json
            output/*/meta.json
            output/*/thumb.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "stickcoin-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in history.json assets/logos; do [ -e "$p" ] && git add "$p" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "video: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
