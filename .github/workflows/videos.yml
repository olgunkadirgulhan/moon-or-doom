name: videos
on:
  schedule:
    # Shorts: günde 5 video. Slotlar 16:00, 18:00, 20:30 UTC (ET 12:00, 14:00, 16:30 · TR 19:00, 21:00, 23:30),
    # her slot 2 video (en çok yükselen + en çok düşen, 5 dk arayla); DAILY_MAX=5 tavanı yüzünden
    # 20:30 slotu 1 video yapar. 09-24..26 verisinde ET öğle/öğleden sonra en iyisiydi, 08:35 ET sabah slotu kaldırıldı.
    # Uzun video (16:9) 15:00 UTC (TR 18:00): Salı 'explained' (trend 3 proje ne?), Cuma 'school' (Chart School dersi).
    # Pazar/Çarşamba haftalık özet Whale Market Pulse'ta; aynı günleri ve konuyu kullanmıyoruz.
    # GitHub cron'u geciktiriyor/düşürüyor: saatlik tetiklenir, .github/slot_guard.py sadece
    # zamanı gelmiş ve yüklenmemiş slot varsa video yapar (boş çalışma ~15 sn).
    - cron: "53 15-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: shorts | explained | school | weekly | majors
        type: choice
        options: [shorts, explained, school, weekly, majors]
        default: shorts
      no_upload:
        description: Render only, do not upload
        type: boolean
        default: false
      coin:
        description: (shorts) Force a CoinGecko id, e.g. solana. Empty = automatic pick
        type: string
        default: ""
      format:
        description: (shorts) Force a format
        type: choice
        options: [auto, levels, what_is, school, skit]
        default: auto
      auto:
        description: External scheduler call - follow the slot plan like a scheduled run
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'schedule' || inputs.auto
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
      mode: ${{ steps.g.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          LOG_FILE: history.json
          SLOTS: "16:00,18:00,20:30"
          PER_SLOT: "1"
          DAILY_MAX: "3"  # config.yaml daily_videos ile aynı tutulmalı
          SHORT_KINDS: "gainer,loser,manual"
          SHORT_MODE: shorts
          # uzun videolar ilk 2 haftada 5-7 izlenme: haftada 2 -> 1
          LONG: "fri 15:00 school"
        run: python3 .github/slot_guard.py

  make:
    needs: guard
    if: always() && ((github.event_name != 'schedule' && !inputs.auto) || needs.guard.outputs.go == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev pkg-config
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stickstory
          key: kokoro-v1.0
      - name: Validator self-test
        run: python tests/test_validate.py
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" != "true" ]; then echo "m=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else echo "m=${{ needs.guard.outputs.mode }}" >> $GITHUB_OUTPUT; fi
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          SCRIPT_SOURCE: ${{ vars.SCRIPT_SOURCE }}
          MODE: ${{ steps.mode.outputs.m }}
          NO_UPLOAD: ${{ inputs.no_upload }}
          COIN: ${{ inputs.coin }}
          FORMAT: ${{ inputs.format }}
        run: |
          ARGS=()
          [ "$NO_UPLOAD" = "true" ] && ARGS+=(--no-upload)
          if [ "$MODE" != "shorts" ]; then ARGS+=(--long "$MODE")
          else
            [ -n "$COIN" ] && ARGS+=(--coin "$COIN")
            [ -n "$FORMAT" ] && [ "$FORMAT" != "auto" ] && ARGS+=(--format "$FORMAT")
          fi
          python run.py "${ARGS[@]}"
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/script.json
            output/*/data.json
            output/*/meta.json
            output/*/thumb.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Günün videosu (Telegram relay için)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: social-${{ github.run_id }}
          path: social/
          retention-days: 3
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "stickcoin-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in history.json assets/logos; do [ -e "$p" ] && git add "$p" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "video: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
